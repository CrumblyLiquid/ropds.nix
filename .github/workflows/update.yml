name: Update ropds

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Record current version
        id: old
        run: echo "version=$(nix eval --raw .#default.version)" >> "$GITHUB_OUTPUT"

      - name: Run nix-update
        run: nix run nixpkgs#nix-update -- --flake default

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(nix eval --raw .#default.version)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated package
        if: steps.check.outputs.changed == 'true'
        run: nix build .#default --print-build-logs

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/ropds
          delete-branch: true
          commit-message: Update to ${{ steps.check.outputs.version }}
          title: "ropds: ${{ steps.old.outputs.version }} -> ${{ steps.check.outputs.version }}"
          body: |
            Automated update of ropds from `${{ steps.old.outputs.version }}` to `${{ steps.check.outputs.version }}`.

            Release notes: https://github.com/dshein-alt/ropds/releases/tag/v${{ steps.check.outputs.version }}

            Generated by `nix-update`; the package was built successfully in CI.
