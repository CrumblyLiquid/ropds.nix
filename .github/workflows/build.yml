name: Build ropds

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: crumblyliquid
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        run: nix build .#default --print-build-logs
